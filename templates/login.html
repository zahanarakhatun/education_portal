{% extends 'master/base.html' %}

{% block content %}
<div style="max-width:450px; margin:50px auto; background:white; padding:30px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1);">
    <h2 style="text-align:center; margin-bottom:20px; color:#6c5ce7;">Login করুন</h2>
    
    {% if messages %}
      {% for message in messages %}
        <div style="background:#ff7675; color:white; padding:10px; border-radius:8px; margin-bottom:15px; text-align:center;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label style="display:block; margin-bottom:5px;">Username</label>
        <input type="text" name="username" required style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px;">
        
        <label style="display:block; margin-bottom:5px;">Password</label>
        <input type="password" name="password" required style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:20px;">
        
        <button type="submit" style="width:100%; padding:12px; background:#6c5ce7; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;">
            Login
        </button>
    </form>
    
    <p style="text-align:center; margin-top:15px;">
        একাউন্ট নাই? <a href="/register/">Register</a>
    </p>
</div>
{% endblock %}
