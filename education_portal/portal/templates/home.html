<!DOCTYPE html>
<html>
<head>
    <title>Education Portal</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f4f8;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 8px;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-register { background: #28a745; }
        .btn-login { background: #007bff; }
        .btn-admin { background: #6c757d; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Education Portal</h1>
        <a href="/register/" class="btn btn-register">Register</a>
        <a href="/login/" class="btn btn-login">Login</a>
        <a href="/admin/" class="btn btn-admin">Admin</a>
    </div>
</body>
</html>
