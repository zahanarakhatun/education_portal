{% extends 'master/base.html' %}

{% block content %}
<div class="container my-5">
    <h2 class="fw-bold text-center mb-4">Our Available Courses</h2>
    
    <div class="row g-4">
        {% for course in courses %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm rounded-4 border-0 hover-shadow">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge bg-primary rounded-pill px-3 py-2">{{ course.badge }}</span>
                    </div>
                    <h5 class="card-title fw-bold">{{ course.title }}</h5>
                    <p class="card-text text-muted flex-grow-1 mt-2">
                        {{ course.description }}
                    </p>
                    <a href="#" class="btn btn-outline-primary w-100 mt-3 rounded-3">Enroll Now</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
